<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoyalTable - 登录</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            <div class="logo-main">ROYAL</div>
            <div class="logo-sub">TABLE</div>
        </div>

        <h2>欢迎回来</h2>
        <p class="auth-desc">Texas Hold'em 娱乐扑克大厅</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-message">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="input-group">
                <label>账号</label>
                <input
                    type="text"
                    name="username"
                    placeholder="请输入账号"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label>密码</label>
                <input
                    type="password"
                    name="password"
                    placeholder="请输入密码"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="auth-button">
                登录
            </button>

        </form>

        <div class="auth-footer">
            还没有账号？
            <a href="{{ url_for('register') }}">立即注册</a>
        </div>

    </div>

</div>

</body>
</html>
